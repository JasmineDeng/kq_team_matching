default_language_version:
  python: python3
repos:
  - repo: https://github.com/PyCQA/isort
    rev: 5.11.5
    hooks:
      - id: isort
        args: [--resolve-all-configs]
  - repo: https://github.com/myint/autoflake.git
    rev: v1.4
    hooks:
      - id: autoflake
        args: ["--in-place", "--remove-all-unused-imports", "--ignore-init-module-imports"]
  - repo: https://github.com/psf/black
    rev: 22.3.0
    hooks:
      - id: black
        args: [--safe, --quiet]
  - repo: https://github.com/PyCQA/flake8
    rev: 5.0.4
    hooks:
      - id: flake8
        additional_dependencies: [flake8-docstrings, flake8-bugbear==22.9.23]
  - repo: local
    hooks:
      - id: prevent-commit-main
        name: Prevent commits on main
        description: Ensure we don't commit directly to main
        entry: ./scripts/prevent_commit_main.sh
        language: script
